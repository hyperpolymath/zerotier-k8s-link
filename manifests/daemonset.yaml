apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zerotier
  namespace: zerotier-system
  labels:
    app.kubernetes.io/name: zerotier
    app.kubernetes.io/version: "1.14"
    app.kubernetes.io/part-of: flatracoon-netstack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zerotier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zerotier
    spec:
      hostNetwork: true
      hostPID: true
      initContainers:
      - name: install-zerotier
        image: alpine:3.19
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          apk add --no-cache zerotier-one
          mkdir -p /var/lib/zerotier-one
          zerotier-one -d
        volumeMounts:
        - name: zerotier-data
          mountPath: /var/lib/zerotier-one
      containers:
      - name: zerotier
        image: zerotier/zerotier:latest
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_RAW
        env:
        - name: ZEROTIER_NETWORK_ID
          valueFrom:
            secretKeyRef:
              name: zerotier-credentials
              key: network-id
        - name: ZEROTIER_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: zerotier-credentials
              key: api-token
              optional: true
        - name: AUTO_JOIN
          valueFrom:
            configMapKeyRef:
              name: zerotier-config
              key: auto-join
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Starting ZeroTier One..."
          zerotier-one -d
          
          # Wait for ZeroTier service to be ready
          for i in $(seq 1 30); do
            if zerotier-cli info >/dev/null 2>&1; then
              echo "ZeroTier service is ready"
              break
            fi
            echo "Waiting for ZeroTier service... ($i/30)"
            sleep 2
          done
          
          # Join network if AUTO_JOIN is enabled
          if [ "$AUTO_JOIN" = "true" ]; then
            echo "Joining network $ZEROTIER_NETWORK_ID..."
            zerotier-cli join "$ZEROTIER_NETWORK_ID"
            
            # Wait for network join
            for i in $(seq 1 60); do
              if zerotier-cli listnetworks | grep -q "$ZEROTIER_NETWORK_ID"; then
                echo "Successfully joined network"
                break
              fi
              echo "Waiting for network join... ($i/60)"
              sleep 2
            done
          fi
          
          # Keep container running and monitor status
          while true; do
            zerotier-cli info
            zerotier-cli listnetworks
            sleep 60
          done
        volumeMounts:
        - name: zerotier-data
          mountPath: /var/lib/zerotier-one
        - name: dev-net-tun
          mountPath: /dev/net/tun
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - zerotier-cli
            - info
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - zerotier-cli listnetworks | grep -q "$(cat /run/secrets/zerotier/network-id)"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: zerotier-data
        hostPath:
          path: /var/lib/zerotier-one
          type: DirectoryOrCreate
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
