#
# DaemonSet configuration for ZeroTier One on Kubernetes.
# This ensures a ZeroTier instance runs on every node, creating a mesh overlay.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zerotier
  namespace: zerotier-system
  labels:
    app.kubernetes.io/name: zerotier
    app.kubernetes.io/version: "1.14"
    app.kubernetes.io/part-of: flatracoon-netstack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zerotier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zerotier
    spec:
      # NETWORKING:
      # hostNetwork: true is REQUIRED for an overlay network.
      # It allows the pod to access the node's network stack directly,
      # creating the 'zt*' interfaces on the host itself, not just inside the pod.
      hostNetwork: true
      
      # PROCESS ISOLATION:
      # hostPID: true is needed to inspect host processes if strictly required,
      # but often used in network tools to avoid namespace isolation issues.
      hostPID: true
      
      initContainers:
      - name: install-zerotier
        image: alpine:3.19
        securityContext:
          # SECURITY: Privileged access is needed to install kernel modules
          # or modify host network settings during initialization.
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          apk add --no-cache zerotier-one
          mkdir -p /var/lib/zerotier-one
          # Generate identity if needed
          zerotier-one -d
        volumeMounts:
        - name: zerotier-data
          mountPath: /var/lib/zerotier-one
      
      containers:
      - name: zerotier
        image: zerotier/zerotier:latest
        securityContext:
          # SECURITY: High privilege requirements
          # - privileged: true: Full access to host devices.
          # - NET_ADMIN: Modify network interfaces/routing tables.
          # - SYS_ADMIN: Perform administration tasks.
          # - NET_RAW: Open raw sockets.
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_RAW
        env:
        # CREDENTIALS:
        # Loaded from secure Kubernetes Secrets.
        - name: ZEROTIER_NETWORK_ID
          valueFrom:
            secretKeyRef:
              name: zerotier-credentials
              key: network-id
        - name: ZEROTIER_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: zerotier-credentials
              key: api-token
              optional: true
        - name: AUTO_JOIN
          valueFrom:
            configMapKeyRef:
              name: zerotier-config
              key: auto-join
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Starting ZeroTier One..."
          zerotier-one -d
          
          # LIVENESS CHECK LOOP
          # Wait for ZeroTier service to be ready before proceeding
          for i in $(seq 1 30); do
            if zerotier-cli info >/dev/null 2>&1; then
              echo "ZeroTier service is ready"
              break
            fi
            echo "Waiting for ZeroTier service... ($i/30)"
            sleep 2
          done
          
          # AUTO-JOIN LOGIC
          # If enabled, automatically join the configured network ID
          if [ "$AUTO_JOIN" = "true" ]; then
            echo "Joining network $ZEROTIER_NETWORK_ID..."
            zerotier-cli join "$ZEROTIER_NETWORK_ID"
            
            # JOIN VERIFICATION LOOP
            for i in $(seq 1 60); do
              if zerotier-cli listnetworks | grep -q "$ZEROTIER_NETWORK_ID"; then
                echo "Successfully joined network"
                break
              fi
              echo "Waiting for network join... ($i/60)"
              sleep 2
            done
          fi
          
          # MAIN LOOP
          # Keep container running and monitor status periodically
          while true; do
            zerotier-cli info
            zerotier-cli listnetworks
            sleep 60
          done
        volumeMounts:
        # PERSISTENCE:
        # Store identity keys on the host so they survive pod restarts.
        - name: zerotier-data
          mountPath: /var/lib/zerotier-one
        # TUN DEVICE:
        # Access to the Universal TUN/TAP device is required for VPN functionality.
        - name: dev-net-tun
          mountPath: /dev/net/tun
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - zerotier-cli
            - info
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - zerotier-cli listnetworks | grep -q "$(cat /run/secrets/zerotier/network-id)"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: zerotier-data
        hostPath:
          path: /var/lib/zerotier-one
          type: DirectoryOrCreate
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      tolerations:
      # TOLERATIONS:
      # Ensure the pod can be scheduled on master/control-plane nodes if needed,
      # providing connectivity to the entire cluster control plane.
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
