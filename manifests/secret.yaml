apiVersion: v1
kind: Secret
metadata:
  name: zerotier-credentials
  namespace: zerotier-system
type: Opaque
stringData:
  # Replace with your actual ZeroTier network ID (16 characters)
  network-id: "EXAMPLE_NETWORK_ID"
  # Replace with your ZeroTier Central API token (if using API-based authorization)
  api-token: "EXAMPLE_API_TOKEN"
